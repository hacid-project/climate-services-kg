# Configuration of the data ingestion workflow (see workflow/Snakefile)

cmor_tables:
  # Editions of the CMOR tables to analyse (rule cmor_tables_analysis; the KG
  # needs only the editions given by the mapping to the MIP variables, see
  # data-sources/cmor-tables/mapping/mip-mapping.md), as {era}/{version}, where {era} is
  # one of the eras of config/cmor-tables-eras.json (which gives its git
  # repository) and {version} a git ref of the repository (usually a tag; a
  # branch, e.g. main, is not rebuilt automatically when it moves: use
  # --forcerun)
  editions:
    - cmip5/5.0
    - cmip6/6.0.11
    - cmip6/6.0.12
    - cmip6/6.0.13
    - cmip6/6.0.14
    - cmip6/6.0.15
    - cmip6/6.0.16
    - cmip6/6.0.17
    - cmip6/6.0.18
    - cmip6/6.0.19
    - cmip6/6.0.19a
    - cmip6/6.0.20
    - cmip6/6.0.21
    - cmip6/6.1.22
    - cmip6/6.1.23
    - cmip6/6.2.24
    - cmip6/6.3.27
    - cmip6/6.3.27-fixed
    - cmip6/6.4.28
    - cmip6/6.5.29
    - cmip6/6.6.30
    - cmip6/6.7.31
    - cmip6/6.8.31
    - cmip6/6.9.32
    - cmip6/6.9.33
    - cmip6plus/v6.5.0.0
    - cmip6plus/v6.5.0.1
    - cmip6plus/v6.5.0.2
    - cmip6plus/v6.5.0.3
    - cmip6plus/v6.5.0.4

cmip5:
  # Edition of the CMOR tables defining the variables of the CMIP5 datasets
  # (as in cmor_tables.editions), used to resolve their MIP variables (also of
  # the CORDEX-CMIP5 datasets)
  cmor_tables: cmip5/5.0

cf_standard_names:
  # Version of the CF standard name table, downloaded from
  # {url}/{version}/src/cf-standard-name-table.xml. The site cfconventions.org
  # is published from the GitHub repository cf-convention/cf-convention.github.io:
  # the same files are at
  # https://raw.githubusercontent.com/cf-convention/cf-convention.github.io/main/Data/cf-standard-names
  version: 86
  url: https://cfconventions.org/Data/cf-standard-names

cordex_domains:
  # Git repository and ref (commit) of the CORDEX domain tables. The commit is
  # the last one with the grids of CORDEX-CMIP5 in two tables, rotated and
  # regular (CORDEX-CMIP5_rotated_grids.csv, CORDEX-CMIP5_regular_grids.csv),
  # before they were merged in CORDEX-CMIP5_grids.csv (without the upper right
  # coordinates)
  repo: https://github.com/WCRP-CORDEX/domain-tables.git
  version: 26696d7a0c559b32791ea3940ea3b0c5e79901e7

cmip5_cvs:
  # Git repository and ref (commit) of the configuration of the ESGF publisher,
  # whose CMIP5 configuration (publisher-configs/ini/esg.cmip5.ini) gives the
  # CMIP5 experiments and, with the models table
  # (publisher-configs/esgcet_models_table.txt), the CMIP5 institutions
  esgf_config_repo: https://github.com/ESGF/config.git
  esgf_config_version: dc19f5b14e2e9408fddcda125c6e9969d12ff846

cordex_cmip5_cvs:
  # Git repository and ref (commit) of the site of IS-ENES Data, whose
  # CORDEX_RCMs_info.txt (also at https://is-enes-data.github.io/CORDEX_RCMs_info.txt)
  # lists the CORDEX RCMs with their institutes
  repo: https://github.com/IS-ENES-Data/IS-ENES-Data.github.io.git
  version: d9c78eca56101cf0684e370bbc2a94ea3836b51a

ontologies:
  # Git repository and ref (commit) of the HACID ontologies, and the
  # ontologies used by the KG (ontologies/{name}/{name}.owl in the repository)
  repo: https://github.com/hacid-project/knowledge-graph.git
  version: 61e336e1623fd12b493cc29a2fad09674d072f18
  names:
    - top-level
    - data
    - ccso

consolidate:
  # Location of the TDB2 dataset of the consolidated KG (not tracked)
  location: kg/tdb2
  # Options of the JVM of the Jena command-line tools (JVM_ARGS)
  jvm_args: -Xmx16G

ukcp18:
  # Number of nodes of each JSON-LD document of the UKCP18 datasets
  # (rdf/datasets/datasets-NNNN.jsonld), framed from the output of the mapping,
  # a node per line: it bounds the memory needed to load them
  block_size: 10000
